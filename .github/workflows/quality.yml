name: GHM quality gate

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: sqlite:///./ghm_ci.db
      SECRET_KEY: ghm-ci-test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Mirror the native dependencies installed by backend/Dockerfile.
      # The optical EAN/UPC scanner needs libzbar at runtime in CI too.
      - name: Install barcode and OCR system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzbar0 tesseract-ocr
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Compile backend
        run: python -m py_compile $(find backend/app -name '*.py')
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: |
          set -o pipefail
          pytest -q -ra --tb=short backend/tests 2>&1 | tee backend-test-results.log
      - name: Save backend failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ghm-backend-test-diagnostics
          path: backend-test-results.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
