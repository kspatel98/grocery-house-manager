server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Immutable Vite fingerprinted assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html stays fresh so installed/mobile browsers see new releases.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
